# ============================================================
# deploy-frontend.yml — CI/CD Pipeline cho Frontend (React)
#
# Luồng deploy frontend với CloudFront:
# 1. Build React app (npm run build)
# 2. Upload build output lên S3 bucket
# 3. Invalidate CloudFront cache (để users thấy phiên bản mới ngay)
#
# Tại sao không dùng ECS cho frontend?
# - Static files không cần server-side logic
# - S3 + CloudFront: rẻ hơn, nhanh hơn, tự scale vô giới hạn
# - Không cần quản lý container hay port
# ============================================================

name: Frontend CI/CD — Build & Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
    paths:
      - 'Taskment/taskment-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  AWS_REGION:             ap-southeast-1
  S3_BUCKET:              taskment-frontend-static-prod
  CLOUDFRONT_DIST_ID:     ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  build-and-deploy:
    name: Build React & Deploy to S3
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Taskment/taskment-frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./Taskment/taskment-frontend
        run: npm ci --legacy-peer-deps

      - name: Build React App
        working-directory: ./Taskment/taskment-frontend
        env:
          # Cấu hình API URL cho production
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_WS_URL: ${{ secrets.REACT_APP_WS_URL }}
          REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
          CI: false    # Bỏ qua warning-as-error của Create React App
        run: npm run build

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Upload files lên S3 với cache headers phù hợp
      - name: Deploy to S3
        working-directory: ./Taskment/taskment-frontend
        run: |
          # Upload static assets với cache dài hạn (1 năm)
          # Create React App đã tự thêm content hash vào tên file → safe to cache forever
          aws s3 sync build/static s3://$S3_BUCKET/static \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

          # Upload index.html với NO cache (luôn fresh)
          aws s3 cp build/index.html s3://$S3_BUCKET/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

          # Upload các file khác (manifest, robots.txt, icons...)
          aws s3 sync build s3://$S3_BUCKET \
            --exclude "static/*" \
            --exclude "index.html" \
            --cache-control "public, max-age=86400" \
            --delete

      # Invalidate CloudFront cache để users thấy phiên bản mới
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DIST_ID \
            --paths "/index.html" "/*.json"
          
          echo "✅ Frontend deployed! CloudFront cache invalidated."
          echo "🌐 Phải chờ vài phút để CloudFront propagate toàn cầu."
