name: Build and Deploy to AWS ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: taskment-backend
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./Taskment
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Build, Tag, and Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: taskment-frontend
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./Taskment/taskment-frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy Backend to Amazon ECS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: taskment-backend
          IMAGE_TAG: latest
        run: |
          # Fetch the active task definition
          aws ecs describe-task-definition --task-definition taskment-backend --region ap-southeast-1 --query 'taskDefinition' > task-def-backend.json
          
          # Update the image URI, set runtime platform to X86_64, and strip read-only metadata fields
          jq --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            '.containerDefinitions[0].image = $IMAGE | .runtimePlatform.cpuArchitecture = "X86_64" | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-def-backend.json > new-task-def-backend.json
          
          # Register new task definition revision
          aws ecs register-task-definition --cli-input-json file://new-task-def-backend.json --region ap-southeast-1
          
          # Force service deployment to update ECS tasks
          aws ecs update-service --cluster taskment-cluster --service taskment-backend-service --task-definition taskment-backend --force-new-deployment --region ap-southeast-1

      - name: Deploy Frontend to Amazon ECS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: taskment-frontend
          IMAGE_TAG: latest
        run: |
          # Fetch the active task definition
          aws ecs describe-task-definition --task-definition taskment-frontend --region ap-southeast-1 --query 'taskDefinition' > task-def-frontend.json
          
          # Update the image URI, set runtime platform to X86_64, and strip read-only metadata fields
          jq --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            '.containerDefinitions[0].image = $IMAGE | .runtimePlatform.cpuArchitecture = "X86_64" | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-def-frontend.json > new-task-def-frontend.json
          
          # Register new task definition revision
          aws ecs register-task-definition --cli-input-json file://new-task-def-frontend.json --region ap-southeast-1
          
          # Force service deployment to update ECS tasks
          aws ecs update-service --cluster taskment-cluster --service taskment-frontend-service --task-definition taskment-frontend --force-new-deployment --region ap-southeast-1
