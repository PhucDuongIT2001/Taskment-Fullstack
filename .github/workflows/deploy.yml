# ============================================================
# deploy-backend.yml — CI/CD Pipeline cho Backend (Spring Boot)
#
# AWS Well-Architected — Operational Excellence Pillar:
#
# CẢI TIẾN SO VỚI PHIÊN BẢN CŨ:
# 1. OIDC thay AWS Access Key: Không cần lưu long-lived credentials
#    → Token tạm thời, expire sau mỗi job
# 2. SHA tag thay 'latest': Mỗi deploy có version riêng, rollback được
#    → git revert → CI/CD tự deploy version cũ
# 3. Unit Test trước khi build: Không deploy code lỗi
# 4. Wait for ECS stability: Xác nhận deploy thành công trước khi kết thúc
# 5. Circuit Breaker: ECS tự rollback nếu health check thất bại
# ============================================================

name: Backend CI/CD — Build, Test & Deploy to AWS ECS

on:
  push:
    branches: [main]
    paths:
      - 'Taskment/**'          # Chỉ chạy khi backend thay đổi
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:           # Cho phép trigger thủ công

env:
  AWS_REGION:       ap-southeast-1
  ECR_REPOSITORY:   taskment-backend
  ECS_CLUSTER:      taskment-cluster-prod
  ECS_SERVICE:      taskment-backend-service
  TASK_DEFINITION:  taskment-backend

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable & Run Unit Tests
        working-directory: ./Taskment
        run: |
          chmod +x mvnw
          ./mvnw test -B --no-transfer-progress
        # Nếu test fail, pipeline dừng lại — không deploy code lỗi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Taskment/target/surefire-reports/

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test                 # Phải pass tests trước khi deploy
    if: github.ref == 'refs/heads/main'

    # Quyền cần thiết cho OIDC token
    permissions:
      id-token: write           # Cần để generate OIDC token
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ============================================================
      # OIDC Authentication (thay thế AWS_ACCESS_KEY_ID)
      # LÝ DO: Không cần lưu long-lived credentials trong GitHub Secrets
      # IAM Role chỉ trust repository này, token expire sau job
      # ============================================================
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ============================================================
      # Build & Push với Git SHA tag (không dùng 'latest')
      # LÝ DO: SHA tag cho phép rollback về commit cụ thể
      # Ví dụ: nếu tag abc1234 có bug → rollback về tag def5678
      # ============================================================
      - name: Build, Tag & Push Backend Image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./Taskment
        run: |
          echo "Building image with tag: $IMAGE_TAG"
          docker build \
            --cache-from $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ============================================================
      # Deploy lên ECS Fargate
      # Sử dụng action chuẩn của AWS thay vì raw CLI
      # ============================================================
      - name: Download Current Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEFINITION }} \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition' \
            > task-def.json

      - name: Update Task Definition with New Image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: taskment-backend
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true   # Đợi ECS xác nhận deploy thành công

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Backend deployed successfully!"
          echo "Image: ${{ steps.build-image.outputs.image }}"
          echo "Commit: ${{ github.sha }}"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Backend deployment failed!"
          echo "ECS Circuit Breaker sẽ tự động rollback về version trước."
