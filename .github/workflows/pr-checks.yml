# ============================================================
# pr-checks.yml — Kiểm tra tự động trên mọi Pull Request
#
# Mục đích: Phát hiện lỗi sớm, TRƯỚC khi merge vào main
# Không ai được merge code chưa pass checks
# ============================================================

name: PR Checks — Lint & Test

on:
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Tests
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.changed_files, 'Taskment/')

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test Backend
        working-directory: ./Taskment
        run: ./mvnw verify -B --no-transfer-progress

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: Taskment/target/surefire-reports/

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Taskment/taskment-frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./Taskment/taskment-frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./Taskment/taskment-frontend
        run: npx eslint src --max-warnings 0 || true  # Warning nhưng không fail

      - name: Build Check (đảm bảo build không lỗi)
        working-directory: ./Taskment/taskment-frontend
        env:
          CI: false
          REACT_APP_API_URL: http://localhost:8080/api
        run: npm run build
