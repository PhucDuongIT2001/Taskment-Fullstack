spring:
  datasource:
    url: jdbc:mysql://localhost:3306/task_management_ai?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
    username: root
    password: "rootpassword"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:

              - email
              - profile
  ai:
    vertex:
      ai:
        gemini:
          project-id: pdenter-b3cb1 # THAY THẾ BẰNG PROJECT ID CỦA BẠN
          location: us-central1 # THÊM DÒNG NÀY
          api-key: ${GEMINI_API_KEY} # Đảm bảo API Key đã được bỏ ghi chú

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

gemini:
  api:
    key: ${GEMINI_API_KEY}

server:
  port: 8888

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3001}
  # Danh sách origin được phép gửi request (CORS)
  # SecurityConfig đọc biến này — phân cách bằng dấu phẩy
  # Production: set ALLOWED_ORIGINS=https://taskment.yourdomain.com trong ECS
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}

server:
  port: 8888   # Port local dev (ECS dùng 8080 qua application-prod.yaml)
