# ============================================================
# docker-compose.yml — Local Development Only
# KHÔNG dùng file này trên production (dùng ECS Fargate thay)
#
# Yêu cầu: Sao chép .env.example thành .env và điền giá trị
# ============================================================

version: '3.8'

services:
  # --- MySQL Database (local dev) ---
  mysql:
    image: mysql:8.0
    container_name: taskment_mysql
    restart: unless-stopped
    environment:
      # Đọc từ file .env (không hardcode ở đây)
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-localdevpassword}
      MYSQL_DATABASE: ${DB_NAME:-task_management_ai}
      MYSQL_USER: ${DB_USERNAME:-taskment_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-localdevpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - taskment_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      interval: 10s

  # --- Backend Spring Boot ---
  backend:
    build: .
    container_name: taskment_backend
    restart: unless-stopped
    env_file:
      - .env   # Đọc toàn bộ biến từ .env (không hardcode credentials)
    environment:
      # Override cho local dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-task_management_ai}
      DB_USERNAME: ${DB_USERNAME:-taskment_user}
      DB_PASSWORD: ${DB_PASSWORD:-localdevpassword}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8888:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - taskment_network

  # --- Frontend React (Nginx) ---
  frontend:
    build: ./taskment-frontend
    container_name: taskment_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - taskment_network

networks:
  taskment_network:
    driver: bridge

volumes:
  mysql_data:     # Persistent volume — data không mất khi restart container
