server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # Gzip Compression — Giảm băng thông, tăng tốc tải trang
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ============================================================
    # Security Headers — AWS Well-Architected Security Pillar
    # ============================================================

    # Ngăn chặn Clickjacking (nhúng trang vào iframe của trang khác)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Ngăn trình duyệt tự đoán Content-Type (MIME sniffing attack)
    add_header X-Content-Type-Options "nosniff" always;

    # Bật XSS filter của trình duyệt
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy — kiểm soát thông tin referrer gửi đi
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy — vô hiệu hóa các browser feature không cần thiết
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy — chỉ cho phép load resource từ nguồn tin cậy
    # Điều chỉnh theo domain thật khi deploy production
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://accounts.google.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https: blob:;
        connect-src 'self' wss: https:;
        frame-src https://accounts.google.com;
    " always;

    # ============================================================
    # Cache Control — Performance Efficiency Pillar
    # ============================================================

    # Cache dài hạn cho static assets có content hash (JS, CSS bundle)
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache trung hạn cho images, fonts
    location ~* \.(png|jpg|jpeg|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ============================================================
    # React Router — SPA fallback
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;
        # Không cache index.html để đảm bảo luôn tải phiên bản mới nhất
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ============================================================
    # Health Check Endpoint (cho Load Balancer / ECS)
    # ============================================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================================
    # Error Pages
    # ============================================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
